<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121722">
<title>Weekly Shops</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#161c2a;--mut:#667089;--bd:#dde2ec;--ok:#0e9f77;--no:#d6455d;--ac:#4b5fd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121722;--card:#1b2232;--tx:#e9edf6;--mut:#8f9ab4;--bd:#2a3349;--ok:#35d3a1;--no:#ff6f86;--ac:#8c9bff}}
:root[data-theme="dark"]{--bg:#121722;--card:#1b2232;--tx:#e9edf6;--mut:#8f9ab4;--bd:#2a3349;--ok:#35d3a1;--no:#ff6f86;--ac:#8c9bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:26px;margin:8px 0 2px;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:14px;margin:0 0 16px}
.hero{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center}
.ring{width:72px;height:72px;flex:none;position:relative}
.ring svg{width:72px;height:72px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px}
.hero p{margin:0;font-size:14px;color:var(--mut)}
.hero strong{display:block;font-size:19px;color:var(--tx)}
.acts{display:flex;gap:8px;margin:12px 0 18px}
.btn{flex:1;border:0;border-radius:14px;padding:13px;font:600 15px inherit;font-family:inherit;cursor:pointer}
.all{background:var(--ok);color:#06241a}
.rst{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
details{background:var(--card);border:1px solid var(--bd);border-radius:18px;margin-bottom:10px;overflow:hidden}
summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}
summary::-webkit-details-marker{display:none}
.ic{width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac);display:grid;place-items:center;flex:none}
.ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nm{flex:1;font-weight:600}
.ct{font-size:13px;color:var(--mut)}
.ct.full{color:var(--ok);font-weight:600}
.row{display:flex;width:100%;align-items:center;gap:12px;border:0;border-top:1px solid var(--bd);background:none;color:var(--tx);padding:13px 14px;font:inherit;text-align:left;cursor:pointer}
.mk{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--no) 16%,transparent);color:var(--no);transition:background .25s,color .25s}
.mk svg,.bi{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.mk svg{width:15px;height:15px}
.bi{width:16px;height:16px;vertical-align:-3px;margin-right:6px}
.on .mk{background:var(--ok);color:#06241a}
.mk.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.mk.pop svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .35s .12s ease-out forwards}
@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
#arc{transition:stroke-dashoffset .6s ease}
.row:active{background:color-mix(in srgb,var(--ac) 8%,transparent)}
.bell{width:100%;margin:-6px 0 16px;display:block}
.bell small{display:block;font-weight:400;color:var(--mut);font-size:12px;margin-top:2px}
@media(prefers-reduced-motion:reduce){.mk.pop,.mk.pop svg path{animation:none;stroke-dashoffset:0}#arc{transition:none}}
.row.on{color:var(--mut)}
.row.on span:last-child{text-decoration:line-through}
.foot{color:var(--mut);font-size:13px;text-align:center;margin-top:18px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="gem" viewBox="0 0 24 24"><path d="M6 4h12l4 6-10 11L2 10z M2 10h20"/></symbol>
<symbol id="chest" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="11" rx="2"/><path d="M3 12h18M12 12v3"/></symbol>
<symbol id="shirt" viewBox="0 0 24 24"><path d="M8 3L3 6l2 4 3-1v11h8V9l3 1 2-4-5-3a4 4 0 01-8 0z"/></symbol>
<symbol id="anvil" viewBox="0 0 24 24"><path d="M4 8h13a3 3 0 01-3 4H9l-1 3h8v3H6v-3l2-3M4 8v2"/></symbol>
<symbol id="bag" viewBox="0 0 24 24"><path d="M6 8h12l1 12H5zM9 8a3 3 0 016 0"/></symbol>
<symbol id="sword" viewBox="0 0 24 24"><path d="M20 4l-9 9M16 4h4v4M4 20l5-5M7 13l4 4"/></symbol>
<symbol id="pin" viewBox="0 0 24 24"><path d="M12 21s-7-6-7-11a7 7 0 0114 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
<symbol id="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
<symbol id="cross" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 21h4"/></symbol>
<symbol id="leaf" viewBox="0 0 24 24"><path d="M5 19C5 10 10 5 20 5c0 10-5 15-14 15M5 19l8-8"/></symbol>
</svg>
<main>
<h1>Weekly shops</h1>
<p class="sub">Resets every Monday at 02:30</p>
<section class="hero">
  <div class="ring"><svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="30" fill="none" stroke="var(--bd)" stroke-width="8"/><circle id="arc" cx="36" cy="36" r="30" fill="none" stroke="var(--ok)" stroke-width="8" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5"/></svg><b id="pct">0%</b></div>
  <p><strong id="cnt">0 of 0 done</strong><span id="msg">Tap an item to mark it done.</span></p>
</section>
<div class="acts">
  <button class="btn all" id="all"><svg class="bi"><use href="#tick"/></svg>Mark all complete</button>
  <button class="btn rst" id="rst"><svg class="bi"><use href="#cross"/></svg>Reset</button>
</div>
<button class="btn rst bell" id="bell"></button>
<div id="list"></div>
<p class="foot">Progress is saved on this device.</p>
</main>
<script>
var SHOPS=[
["Featured","gem",["Bag of Coins","Lingering Melody"]],
["Legacy Exchange","chest",["Re-attunement Stone: Dustless","Inner Way Note: Chest","Mystic Skill Breakthrough chests","Retuning Stone"]],
["Red Gold Boutique","shirt",["Resonating Melody"]],
["Sect Shop","anvil",["Lodestone","Peridot","Small Ratchet"]],
["Social Shop","bag",["Arena Attunement Stone","Transdust: Lingering Melody","Transdust: Random Collectible box"]],
["Appearance Exchange","shirt",["Lingering Melody"]],
["Combat Development","sword",["Golden Silk Coin Bag","Howling Ore","Inner Way Note: Chest","Mystic Skill Breakthrough chests","Life Supplies Support Box","Martial Arts breakthrough chests"]],
["Gear Chest","chest",["Gear Chest"]],
["Season Catch-up","leaf",["Martial Arts breakthrough chests"]],
["Legendary Gear Exchange","sword",["Re-attunement Stone","Retuning Stones","Legendary chests"]],
["Profession Development","anvil",["Career Notebook","Scholar Giftbox","Healer Giftbox","Custom Career Giftbox"]],
["Hu Niu’er’s General Goods","pin",["Raw Ore","Chloride Schist","Cold Iron","Dushan Jade","Dushan Blue Jade"]],
["Kaifeng General Goods","pin",["Raw Ore"]],
["Harvestfall Village Vendor","pin",["Wine Scented Jade","Raw Ore"]],
["Heaven’s Pier Merchant","pin",["Wine Scented Jade"]]
];
var KEY="wwm-weekly-v1",total=0,open={},lastKey="",allPop=false;
SHOPS.forEach(function(s){total+=s[2].length});
function weekId(){var d=new Date(Date.now()-9000000);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toDateString()}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.week===weekId())return s}catch(e){}return{week:weekId(),done:{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
var st=load();
function render(){
  var n=Object.keys(st.done).length,p=Math.round(n/total*100),h="";
  SHOPS.forEach(function(s,i){
    var c=0;s[2].forEach(function(_,j){if(st.done[i+"-"+j])c++});
    h+='<details data-i="'+i+'"'+(open[i]===false?'':' open')+'><summary><span class="ic"><svg><use href="#'+s[1]+'"/></svg></span><span class="nm">'+s[0]+'</span><span class="ct'+(c===s[2].length?' full':'')+'">'+c+'/'+s[2].length+'</span></summary>';
    s[2].forEach(function(t,j){var k=i+"-"+j,on=st.done[k];
      h+='<button class="row'+(on?' on':'')+'" data-k="'+k+'"><span class="mk'+((on&&(allPop||k===lastKey))?' pop':'')+'"><svg><use href="#'+(on?'tick':'cross')+'"/></svg></span><span>'+t+'</span></button>'});
    h+='</details>';
  });
  document.getElementById("list").innerHTML=h;
  document.getElementById("arc").style.strokeDashoffset=188.5*(1-n/total);
  document.getElementById("pct").textContent=p+"%";
  document.getElementById("cnt").textContent=n+" of "+total+" done";
  document.getElementById("msg").textContent=n===total?"All done for this week.":"Tap an item to mark it done.";
  lastKey="";
}
document.getElementById("list").addEventListener("click",function(e){
  var r=e.target.closest(".row");
  if(r){var k=r.dataset.k;if(st.done[k])delete st.done[k];else{st.done[k]=1;lastKey=k}save();render()}
});
document.getElementById("list").addEventListener("toggle",function(e){open[e.target.dataset.i]=e.target.open},true);
document.getElementById("all").onclick=function(){SHOPS.forEach(function(s,i){s[2].forEach(function(_,j){st.done[i+"-"+j]=1})});allPop=true;save();render();allPop=false};
document.getElementById("rst").onclick=function(){st.done={};save();render()};
/* Reminders: Monday, Thursday, Saturday (last day) at 09:00 */
var RD=[1,4,6],bell=document.getElementById("bell");
function g(k){try{return localStorage.getItem(k)}catch(e){return null}}
function s(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function left(){return total-Object.keys(st.done).length}
function native(){return window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications}
function bellUI(note){var on=g("wwm-notif")==="1";bell.innerHTML='<svg class="bi"><use href="#bell"/></svg>'+(on?'Reminders on':'Turn on reminders')+'<small>'+(note||'Mon, Thu and Sat (last day) at 09:00')+'</small>'}
async function nativeSchedule(){var LN=Capacitor.Plugins.LocalNotifications,p=await LN.requestPermissions();if(p.display!=="granted")return false;
  await LN.cancel({notifications:RD.map(function(d){return{id:d}})});
  await LN.schedule({notifications:RD.map(function(d){return{id:d,title:d===6?"Last day this week":"Weekly shops",body:d===6?"Final chance to finish your shop checklist before Monday’s reset.":"Time to check your weekly shop checklist.",schedule:{on:{weekday:d+1,hour:9,minute:0},allowWhileIdle:true}}})});return true}
bell.onclick=async function(){var ok=false;
  try{if(native())ok=await nativeSchedule();else if("Notification" in window){ok=(await Notification.requestPermission())==="granted";if(ok)new Notification("Reminders on",{body:"You’ll be reminded on Monday, Thursday and Saturday."})}}catch(e){}
  if(ok){s("wwm-notif","1");bellUI();dueCheck()}else bellUI("Not allowed here. The APK gives reliable reminders.")};
function dueCheck(){if(native()||!("Notification" in window)||Notification.permission!=="granted"||g("wwm-notif")!=="1")return;
  var d=new Date(),day=d.getDay(),key=d.toDateString();if(RD.indexOf(day)<0||left()===0||g("wwm-last")===key)return;
  var t=new Date();t.setHours(9,0,0,0);
  function f(){if(left()===0)return;s("wwm-last",key);try{new Notification(day===6?"Last day this week":"Weekly shops",{body:day===6?left()+" items left before Monday’s reset.":left()+" items left on your checklist."})}catch(e){}}
  if(t>d)setTimeout(f,t-d);else f()}
bellUI();dueCheck();
render();
</script>
</body>
</html>
