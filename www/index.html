<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121722">
<title>Weekly Shops</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#161c2a;--mut:#667089;--bd:#dde2ec;--no:#d6455d;--ac:#1fb58f;--ok:#1fb58f;--on:#06241a;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121722;--card:#1b2232;--tx:#e9edf6;--mut:#8f9ab4;--bd:#2a3349;--no:#ff6f86}}
:root[data-theme="dark"]{--bg:#121722;--card:#1b2232;--tx:#e9edf6;--mut:#8f9ab4;--bd:#2a3349;--no:#ff6f86}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
button{font-family:inherit}
.track{position:fixed;top:0;left:0;width:200%;height:100%;display:flex;transition:transform .38s cubic-bezier(.32,.72,0,1);will-change:transform}
.page{width:50%;height:100%;overflow-y:auto;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 100px)}
.page>.in{max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hact{display:flex;gap:8px}
h1{font-size:26px;margin:8px 0 2px;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:14px;margin:0 0 16px}
.bi{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .12s,background .2s}
.ib.on{background:var(--ac);color:var(--on);border-color:transparent}
.ib:active,.btn:active,.chip:active{transform:scale(.95)}
.hero{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center}
.ring{width:72px;height:72px;flex:none;position:relative}
.ring svg{width:72px;height:72px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px}
.hero p{margin:0;font-size:14px;color:var(--mut)}
.hero strong{display:block;font-size:19px;color:var(--tx)}
.acts{display:flex;gap:8px;margin:12px 0 16px}
.btn{flex:1;border:0;border-radius:14px;padding:13px;font-weight:600;font-size:15px;cursor:pointer;background:var(--ac);color:var(--on);transition:transform .12s,background .2s}
.rst{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
details,.arr{background:var(--card);border:1px solid var(--bd);border-radius:18px;margin-bottom:10px;overflow:hidden}
summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 8px 12px 14px;cursor:pointer}
summary::-webkit-details-marker{display:none}
.arr{display:flex;align-items:center;gap:12px;padding:10px 8px 10px 6px}
.ic{width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac);display:grid;place-items:center;flex:none}
.ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ct{font-size:13px;color:var(--mut)}
.ct.full{color:var(--ok);font-weight:600}
.mb,.grip,.xb{border:0;background:none;color:var(--mut);padding:8px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.grip{touch-action:none;cursor:grab}
.xb{color:var(--no)}
.row{display:flex;width:100%;align-items:center;gap:12px;border:0;border-top:1px solid var(--bd);background:var(--card);color:var(--tx);padding:13px 14px;font:inherit;text-align:left;cursor:pointer}
.row:active{background:color-mix(in srgb,var(--ac) 8%,var(--card))}
.row.on{color:var(--mut)}
.row.on .tx{text-decoration:line-through}
.row.edit{cursor:default;padding:4px 8px 4px 6px;gap:6px}
.row.edit .tx{flex:1;padding:10px 6px;cursor:text;min-width:0;overflow-wrap:anywhere}
.empty{margin:0;padding:14px;border-top:1px solid var(--bd);color:var(--mut);font-size:14px}
.eadd{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--bd)}
.dragging{position:relative;z-index:3;box-shadow:0 10px 28px rgba(0,0,0,.3)}
.mk{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--no) 16%,transparent);color:var(--no);transition:background .25s,color .25s}
.mk svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.on .mk{background:var(--ok);color:var(--on)}
.mk.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.mk.pop svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .35s .12s ease-out forwards}
@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ringp{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.ring.fin{animation:ringp .6s}
#arc{transition:stroke-dashoffset .6s ease}
.foot{color:var(--mut);font-size:13px;text-align:center;margin-top:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 12px;font-size:14px;cursor:pointer;min-width:44px;transition:transform .12s,background .2s}
.chip.on{background:var(--ac);color:var(--on);border-color:transparent;font-weight:600}
.seg{display:flex;gap:6px;background:var(--bg);border-radius:12px;padding:4px;width:100%}
.seg .chip{flex:1;border:0;background:none}
.seg .chip.on{background:var(--ac)}
/* settings */
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:24px 6px 8px;font-weight:600}
.grp{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.sr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--bd);min-height:52px;width:100%;background:none;color:var(--tx);font:inherit;text-align:left;border-left:0;border-right:0;border-bottom:0}
.sr:first-child{border-top:0}
.sr small{display:block;color:var(--mut);font-size:12px}
.sr .v{color:var(--mut);font-size:14px}
.sr.act{cursor:pointer}
.sr.act .l{color:var(--ac);font-weight:600}
.sr.dng .l{color:var(--no);font-weight:600}
.sr.col{flex-direction:column;align-items:stretch}
.sr select,.sr input[type=time]{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
.sws{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--tx)}
input[type=color]{width:38px;height:34px;border:0;background:none;padding:0}
.sw2{position:relative;width:46px;height:28px;flex:none}
.sw2 input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;z-index:1;cursor:pointer}
.sw2 span{position:absolute;inset:0;border-radius:14px;background:var(--bd);transition:background .25s}
.sw2 span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.sw2 input:checked+span{background:var(--ac)}
.sw2 input:checked+span::after{transform:translateX(18px)}
.err{background:var(--no);color:#fff;padding:10px 14px;border-radius:12px;margin-bottom:12px;font-size:13px;overflow-wrap:anywhere}
a.sr{text-decoration:none}
.logo{width:72px;height:72px;object-fit:contain;border-radius:18px;background:#fff;padding:8px}
.note{color:var(--mut);font-size:12px;margin:8px 8px 0}
/* nav */
.nav{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);z-index:5;padding:4px;border-radius:18px;background:color-mix(in srgb,var(--card) 60%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid color-mix(in srgb,var(--tx) 12%,transparent);box-shadow:0 10px 26px rgba(0,0,0,.28);transition:transform .38s cubic-bezier(.32,.72,0,1),opacity .3s}
.nav.hide{transform:translate(-50%,160%);opacity:0}
.nav .in{position:relative;display:grid;grid-template-columns:repeat(2,52px)}
.nav button{position:relative;z-index:1;border:0;background:none;color:var(--mut);display:grid;place-items:center;height:38px;cursor:pointer;transition:color .25s}
.nav button.on{color:var(--ac)}
.nav button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.nav button.on svg{transform:scale(1.12)}
.pill{position:absolute;top:0;bottom:0;left:0;width:50%;border-radius:14px;background:color-mix(in srgb,var(--ac) 16%,transparent);transition:transform .38s cubic-bezier(.32,.72,0,1)}
.pill.s{transform:translateX(100%)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);transform:translate(-50%,20px);opacity:0;background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;max-width:88%;text-align:center;z-index:30;pointer-events:none;transition:transform .3s,opacity .3s}
.toast.show{transform:translate(-50%,0);opacity:1}
/* sheet */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.shade{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .25s}
.sheet{position:relative;width:100%;max-width:560px;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:86vh;overflow-y:auto}
.ov.show .shade{opacity:1}
.ov.show .sheet{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--bd);margin:0 auto 12px}
.sh-t{font-weight:700;font-size:18px;margin:0 0 8px}
.sh-m{color:var(--mut);font-size:14px;margin:0 0 14px}
.srow{display:flex;align-items:center;gap:14px;width:100%;border:0;border-top:1px solid var(--bd);background:none;color:var(--tx);font:inherit;padding:14px 2px;cursor:pointer;text-align:left}
.srow svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--mut)}
.srow.dng,.srow.dng svg{color:var(--no)}
.igrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 4px}
.igrid button{aspect-ratio:1;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);display:grid;place-items:center;cursor:pointer}
.igrid button.on{border-color:var(--ac);color:var(--ac)}
.igrid svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.inp{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:13px;margin-bottom:12px}
.brow{display:flex;gap:8px}
.doc2{color:var(--mut);font-size:14px;margin-bottom:14px}
.doc2 p,.doc2 li{margin:6px 0}
.doc2 ul{padding-left:18px;margin:6px 0}
.doc2 b{color:var(--tx)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="track" id="track">
 <div class="page" id="home"><div class="in">

 </div></div>

var ICONS=["gem","chest","shirt","anvil","bag","sword","pin","leaf","star"],VERSION="1.6.0";
var $=function(i){return document.getElementById(i)};
window.addEventListener("error",function(e){var b=$("err");if(b){b.hidden=false;b.textContent="Something went wrong: "+e.message}});
function g(k){try{return localStorage.getItem(k)}catch(e){return null}}
function s(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return"n"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
var tt;function toast(m){var e=$("toast");e.textContent=m;e.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){e.classList.remove("show")},3400)}

/* ---------- data ---------- */
var DEF={days:[1,4,6],time:"09:00",times:1,last:true,lastH:3,accent:"#1fb58f",theme:"auto"};
var cfg=DEF;try{cfg=Object.assign({},DEF,JSON.parse(g("wwm-cfg")||"{}"))}catch(e){}
function defaults(){return SHOPS.map(function(x,i){return{id:"s"+i,name:x[0],ic:x[1],items:x[2].map(function(t,j){return{id:i+"-"+j,t:t}})}})}
function seed(){var a=defaults();
  SHOPS.forEach(function(x,i){((cfg.extra||{})[i]||[]).forEach(function(c){a[i].items.push({id:"c"+c.id,t:c.t})})});
  (cfg.cats||[]).forEach(function(c){a.push({id:"k"+c.id,name:c.name,ic:"star",items:c.items.map(function(i){return{id:"c"+i.id,t:i.t}})})});
  if(cfg.custom&&cfg.custom.length)a.push({id:"kc",name:"My tasks",ic:"star",items:cfg.custom.map(function(c){return{id:"c"+c.id,t:c.t}})});
  return a}
var L;try{L=JSON.parse(g("wwm-lists"))}catch(e){}
if(!Array.isArray(L)||(!L.length&&g("wwm-init")!=="1")){L=seed();s("wwm-lists",JSON.stringify(L))}s("wwm-init","1");
var KEY="wwm-weekly-v1",opn={},lastKey="",allPop=false,timers=[],intro=true,wasFin=false,mode="";
function weekId(){var d=new Date(Date.now()-9000000);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toDateString()}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY));if(x&&x.week===weekId())return x}catch(e){}return{week:weekId(),done:{}}}
function save(){s(KEY,JSON.stringify(st))}
var st=load();
function byId(id){return L.filter(function(x){return x.id===id})[0]}
function saveL(){s("wwm-lists",JSON.stringify(L));render()}
function counts(){var t=0,d=0;L.forEach(function(x){x.items.forEach(function(i){t++;if(st.done[i.id])d++})});return{t:t,d:d}}
function left(){var c=counts();return c.t-c.d}
function lum(h){var n=parseInt(h.slice(1),16);return(.299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255))/255}
function look(){var r=document.documentElement;
  if(cfg.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",cfg.theme);
  r.style.setProperty("--ac",cfg.accent);r.style.setProperty("--ok",cfg.accent);r.style.setProperty("--on",lum(cfg.accent)>.6?"#10151f":"#fff")}
function saveCfg(){s("wwm-cfg",JSON.stringify(cfg));look();sched();dueCheck()}

/* ---------- sheets ---------- */
var ov=$("ov"),shEl=$("sheet"),shH=null,shT;
function sheet(html,h){clearTimeout(shT);shEl.innerHTML='<div class="grab"></div>'+html;shH=h;ov.hidden=false;requestAnimationFrame(function(){requestAnimationFrame(function(){ov.classList.add("show")})})}
function closeSheet(){ov.classList.remove("show");shT=setTimeout(function(){ov.hidden=true;shEl.innerHTML=""},300)}
shEl.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(b&&shH)shH(b.dataset.a,b)});
shEl.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="sin"&&shH)shH("ok")});
$("shade").addEventListener("click",closeSheet);
function srow(a,ic,label,dng){return'<button class="srow'+(dng?' dng':'')+'" data-a="'+a+'"><svg><use href="#'+ic+'"/></svg>'+label+'</button>'}
function ask(title,val,okLabel,cb){
  sheet('<p class="sh-t">'+title+'</p><input class="inp" id="sin" maxlength="60" value="'+esc(val)+'" autocomplete="off"><div class="brow"><button class="btn rst" data-a="no">Cancel</button><button class="btn" data-a="ok">'+okLabel+'</button></div>',function(a){
    if(a==="no")closeSheet();else if(a==="ok"){var v=$("sin").value.trim();if(!v){toast("Please enter a name");return}closeSheet();cb(v)}});
  setTimeout(function(){var i=$("sin");if(i){i.focus();i.select()}},330)}
function confirmS(title,msg,okLabel,cb){
  sheet('<p class="sh-t">'+title+'</p><p class="sh-m">'+msg+'</p><div class="brow"><button class="btn rst" data-a="no">Cancel</button><button class="btn" style="background:var(--no);color:#fff" data-a="ok">'+okLabel+'</button></div>',function(a){closeSheet();if(a==="ok")cb()})}
function docS(title,html){sheet('<p class="sh-t">'+title+'</p><div class="doc2">'+html+'</div><button class="btn" style="width:100%" data-a="x">Close</button>',closeSheet)}

/* ---------- category / item actions ---------- */
function addItem(lid){ask("Add item","","Add",function(v){byId(lid).items.push({id:uid(),t:v});saveL();toast("Item added")})}
function renItem(lid,id){var it=byId(lid).items.filter(function(i){return i.id===id})[0];ask("Rename item",it.t,"Save",function(v){it.t=v;saveL()})}
function delItem(lid,id){var x=byId(lid);x.items=x.items.filter(function(i){return i.id!==id});delete st.done[id];save();saveL();toast("Item removed")}
function addCat(){ask("New category","","Create",function(v){var c={id:uid(),name:v,ic:"star",items:[]};L.push(c);opn[c.id]=true;saveL();toast("Category created. Open ⋯ to add items.")})}
function menu(lid){var x=byId(lid);
  sheet('<p class="sh-t">'+esc(x.name)+'</p>'+srow("add","plus","Add item")+srow("edit","i-list","Edit items")+srow("ren","pencil","Rename category")+srow("ico","star","Change icon")+srow("del","trash","Delete category",1),function(a){
    if(a==="add")addItem(lid);
    else if(a==="edit"){closeSheet();mode="edit:"+lid;opn[lid]=true;render()}
    else if(a==="ren")ask("Rename category",x.name,"Save",function(v){x.name=v;saveL()});
    else if(a==="ico")iconPick(x);
    else if(a==="del")confirmS("Delete “"+esc(x.name)+"”?","This removes the category and its "+x.items.length+" item(s).","Delete",function(){x.items.forEach(function(i){delete st.done[i.id]});L=L.filter(function(c){return c.id!==lid});save();saveL();toast("Category deleted")})})}
function iconPick(x){
  sheet('<p class="sh-t">Choose an icon</p><div class="igrid">'+ICONS.map(function(n){return'<button data-a="i:'+n+'" class="'+(x.ic===n?'on':'')+'" aria-label="'+n+'"><svg><use href="#'+n+'"/></svg></button>'}).join("")+'</div>',function(a){
    if(a.indexOf("i:")===0){x.ic=a.slice(2);closeSheet();saveL()}})}

/* ---------- home render ---------- */
function render(){
  var c=counts(),h="";
  if(!L.length)h='<p class="sub" style="text-align:center;margin:30px 0">No categories yet. Tap + to create one.</p>';
  L.forEach(function(x,i){
    var n=0;x.items.forEach(function(it){if(st.done[it.id])n++});
    var ic='<span class="ic"><svg><use href="#'+x.ic+'"/></svg></span>',mb='<button class="mb" data-menu="'+x.id+'" aria-label="Category options"><svg class="bi"><use href="#more"/></svg></button>';
    if(mode==="arrange"){
      h+='<div class="arr" data-lid="'+x.id+'"><button class="grip" data-drag aria-label="Drag to reorder"><svg class="bi"><use href="#grip"/></svg></button>'+ic+'<span class="nm">'+esc(x.name)+'</span><span class="ct">'+x.items.length+' items</span>'+mb+'</div>';return}
    var ed=mode==="edit:"+x.id,rows="";
    x.items.forEach(function(it){
      if(ed)rows+='<div class="row edit" data-id="'+it.id+'"><button class="grip" data-drag aria-label="Drag to reorder"><svg class="bi"><use href="#grip"/></svg></button><span class="tx" data-ren="'+it.id+'">'+esc(it.t)+'</span><button class="xb" data-del="'+it.id+'" aria-label="Delete item"><svg class="bi"><use href="#trash"/></svg></button></div>';
      else{var on=st.done[it.id];rows+='<button class="row'+(on?' on':'')+'" data-k="'+it.id+'"><span class="mk'+((on&&(allPop||it.id===lastKey))?' pop':'')+'"><svg><use href="#'+(on?'tick':'cross')+'"/></svg></span><span class="tx">'+esc(it.t)+'</span></button>'}});
    if(!x.items.length)rows='<p class="empty">No items yet. Use ⋯ then Add item.</p>';
    h+='<details data-lid="'+x.id+'"'+((ed||opn[x.id]!==false)?' open':'')+(intro?' style="animation:up .45s '+(i*45)+'ms both"':'')+'><summary>'+ic+'<span class="nm">'+esc(x.name)+'</span><span class="ct'+(x.items.length&&n===x.items.length?' full':'')+'">'+n+'/'+x.items.length+'</span>'+mb+'</summary><div class="items" data-lid="'+x.id+'">'+rows+'</div>'+(ed?'<div class="eadd"><button class="chip" data-addi="'+x.id+'">+ Add item</button><button class="chip on" data-done>Done</button></div>':'')+'</details>'});
  $("list").innerHTML=h;
  $("btnArr").classList.toggle("on",mode==="arrange");
  $("arc").style.strokeDashoffset=188.5*(1-(c.t?c.d/c.t:0));
  $("pct").textContent=(c.t?Math.round(c.d/c.t*100):0)+"%";
  $("cnt").textContent=c.d+" of "+c.t+" done";
  $("msg").textContent=c.t&&c.d===c.t?"All done for this week.":"Tap an item to mark it done.";
  lastKey="";intro=false;
  var fin=c.t>0&&c.d===c.t;if(fin&&!wasFin){var rg=document.querySelector(".ring");rg.classList.remove("fin");void rg.offsetWidth;rg.classList.add("fin")}wasFin=fin}
$("list").addEventListener("click",function(e){var t=e.target,m;
  if(m=t.closest("[data-menu]")){e.preventDefault();menu(m.dataset.menu);return}
  if(t.closest("[data-done]")){mode="";render();return}
  if(m=t.closest("[data-addi]")){addItem(m.dataset.addi);return}
  if(m=t.closest("[data-ren]")){renItem(m.closest(".items").dataset.lid,m.dataset.ren);return}
  if(m=t.closest("[data-del]")){delItem(m.closest(".items").dataset.lid,m.dataset.del);return}
  if(m=t.closest(".row[data-k]")){var k=m.dataset.k;if(st.done[k])delete st.done[k];else{st.done[k]=1;lastKey=k}save();render()}});
$("list").addEventListener("toggle",function(e){if(e.target.dataset&&e.target.dataset.lid)opn[e.target.dataset.lid]=e.target.open},true);
$("all").onclick=function(){L.forEach(function(x){x.items.forEach(function(i){st.done[i.id]=1})});allPop=true;save();render();allPop=false};
$("rst").onclick=function(){st.done={};save();render()};
$("btnAdd").onclick=addCat;
$("btnArr").onclick=function(){mode=mode==="arrange"?"":"arrange";render()};

/* ---------- drag to reorder ---------- */
$("list").addEventListener("pointerdown",function(e){var hd=e.target.closest("[data-drag]");if(!hd)return;
  var wrap,sel,drop;
  if(mode==="arrange"){wrap=$("list");sel=".arr";drop=function(f,t){var m=L.splice(f,1)[0];L.splice(t,0,m);saveL()}}
  else{wrap=hd.closest(".items");sel=".row.edit";var x=byId(wrap.dataset.lid);drop=function(f,t){var m=x.items.splice(f,1)[0];x.items.splice(t,0,m);saveL()}}
  startDrag(e,hd,wrap,sel,drop)});
function startDrag(e,hd,wrap,sel,drop){
  var el=hd.closest(sel);if(!el)return;e.preventDefault();
  var page=wrap.closest(".page"),kids=[].slice.call(wrap.children).filter(function(k){return k.matches(sel)}),from=kids.indexOf(el),to=from;
  var tops=kids.map(function(k){return k.offsetTop}),hs=kids.map(function(k){return k.offsetHeight}),gap=kids.length>1?tops[1]-tops[0]-hs[0]:0,step=hs[from]+gap;
  var sc0=page.scrollTop,y0=e.clientY,ly=y0,iv;
  try{hd.setPointerCapture(e.pointerId)}catch(x){}
  el.classList.add("dragging");
  kids.forEach(function(k){if(k!==el)k.style.transition="transform .18s"});
  function update(){var dy=ly-y0+(page.scrollTop-sc0);el.style.transform="translateY("+dy+"px)";
    var c=tops[from]+hs[from]/2+dy;to=from;
    kids.forEach(function(k,i){var mid=tops[i]+hs[i]/2;if(i>from&&c>mid)to=Math.max(to,i);if(i<from&&c<mid)to=Math.min(to,i)});
    kids.forEach(function(k,i){if(i===from)return;var sh=0;if(from<to&&i>from&&i<=to)sh=-step;else if(from>to&&i>=to&&i<from)sh=step;k.style.transform=sh?"translateY("+sh+"px)":""})}
  function mv(ev){ly=ev.clientY;update()}
  function end(){clearInterval(iv);hd.removeEventListener("pointermove",mv);hd.removeEventListener("pointerup",end);hd.removeEventListener("pointercancel",end);
    el.classList.remove("dragging");kids.forEach(function(k){k.style.transform="";k.style.transition=""});
    if(to!==from)drop(from,to)}
  iv=setInterval(function(){var r=page.getBoundingClientRect();if(ly<r.top+90)page.scrollTop-=10;else if(ly>r.bottom-130)page.scrollTop+=10;else return;update()},16);
  hd.addEventListener("pointermove",mv);hd.addEventListener("pointerup",end);hd.addEventListener("pointercancel",end)}

/* ---------- notifications ---------- */
var ORDER=[1,2,3,4,5,6,0],CH="wwm_reminders_v2";
function native(){return window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications}
function hm(){var p=cfg.time.split(":");return(+p[0])*60+(+p[1])}
function lastDay(){return ORDER.filter(function(d){return cfg.days.indexOf(d)>=0}).pop()}
function msgFor(d){return d===lastDay()?["Last day this week","Final chance to finish your checklist before Monday’s reset."]:["Weekly shops","Time to check your weekly shop checklist."]}
async function ensureCh(){try{await Capacitor.Plugins.LocalNotifications.createChannel({id:CH,name:"Shop reminders",description:"Weekly shop checklist reminders",importance:5,visibility:1,vibration:true})}catch(e){}}
async function sched(){
  if(!native())return;var LN=Capacitor.Plugins.LocalNotifications;
  try{var p=await LN.getPending();if(p.notifications.length)await LN.cancel({notifications:p.notifications})}catch(e){}
  if(g("wwm-notif")!=="1")return;
  await ensureCh();var list=[],base=hm();
  cfg.days.forEach(function(d){for(var n=0;n<cfg.times;n++){var m=base+n*240;if(m>=1440)break;var t=msgFor(d);
    list.push({id:100+d*10+n,title:t[0],body:t[1],channelId:CH,schedule:{on:{weekday:d+1,hour:Math.floor(m/60),minute:m%60},allowWhileIdle:true}})}});
  if(cfg.last){var m=150-cfg.lastH*60,wd=2;if(m<0){m+=1440;wd=1}
    list.push({id:900,title:"Shops reset soon",body:"Reset in "+cfg.lastH+"h. Finish what’s left.",channelId:CH,schedule:{on:{weekday:wd,hour:Math.floor(m/60),minute:m%60},allowWhileIdle:true}})}
  if(list.length)try{await LN.schedule({notifications:list})}catch(e){}}
async function enable(){var ok=false;
  try{if(native()){var p=await Capacitor.Plugins.LocalNotifications.requestPermissions();ok=p.display==="granted"}
  else if("Notification" in window){ok=(await Notification.requestPermission())==="granted"}}catch(e){}
  if(ok){s("wwm-notif","1");await sched();dueCheck();toast("Reminders on")}
  else{s("wwm-notif","0");toast(native()?"Blocked. Allow in Android Settings > Apps > Weekly Shops > Notifications.":"Not available in this browser. Use the APK for reminders.")}
  return ok}
function dueCheck(){timers.forEach(clearTimeout);timers=[];
  if(native()||!("Notification" in window)||Notification.permission!=="granted"||g("wwm-notif")!=="1")return;
  var d=new Date();if(cfg.days.indexOf(d.getDay())<0)return;
  for(var n=0;n<cfg.times;n++){var m=hm()+n*240;if(m>=1440)break;var t=new Date();t.setHours(0,m,0,0);
    if(t>d)timers.push(setTimeout(function(){if(left()>0){var x=msgFor(new Date().getDay());try{new Notification(x[0],{body:left()+" items left. "+x[1]})}catch(e){}}},t-d))}}
async function permState(){try{if(native()){var p=await Capacitor.Plugins.LocalNotifications.checkPermissions();return p.display==="granted"?"Allowed":p.display==="denied"?"Blocked":"Not asked yet"}if("Notification" in window)return Notification.permission==="granted"?"Allowed":Notification.permission==="denied"?"Blocked":"Not asked yet"}catch(e){}return"Unavailable here"}
function showPerm(){permState().then(function(t){var e=$("ps"),b=$("allowb");if(e)e.textContent=t;if(b)b.hidden=t==="Allowed"})}
async function testNotif(){
  try{
    if(native()){var LN=Capacitor.Plugins.LocalNotifications,p=await LN.checkPermissions();
      if(p.display!=="granted")p=await LN.requestPermissions();
      if(p.display!=="granted"){toast("Blocked. Allow in Android Settings > Apps > Weekly Shops > Notifications.");showPerm();return}
      await ensureCh();
      await LN.schedule({notifications:[{id:999,title:"Test reminder",body:"Reminders are working.",channelId:CH,schedule:{at:new Date(Date.now()+1500),allowWhileIdle:true}}]});toast("Test sent. Check your notifications.")}
    else if("Notification" in window){var r=Notification.permission==="granted"?"granted":await Notification.requestPermission();
      if(r!=="granted"){toast("Notifications are blocked in this browser.");return}new Notification("Test reminder",{body:"Reminders are working."});toast("Test sent")}
    else toast("Not available in this browser. Use the APK.")
  }catch(e){toast("Could not send: "+(e&&e.message?e.message:"unknown error"))}
  showPerm()}
async function firstRun(){if(!native())return;var LN=Capacitor.Plugins.LocalNotifications;
  try{await ensureCh();var p=await LN.checkPermissions();
    if(p.display==="prompt"||p.display==="prompt-with-rationale")p=await LN.requestPermissions();
    if(p.display==="granted"){if(g("wwm-notif")===null)s("wwm-notif","1");await sched()}else s("wwm-notif","0")}
  catch(e){toast("Notification setup failed: "+(e&&e.message?e.message:"unknown error"))}}

/* ---------- settings ---------- */
var SW=["#1fb58f","#4b5fd6","#e0577a","#e8933a","#9a5bd6","#2b9be0"];
function sec(t,rows,note){return'<div class="sec"><h3>'+t+'</h3><div class="grp">'+rows.join("")+'</div>'+(note?'<p class="note">'+note+'</p>':"")+'</div>'}
function sr(l,right,sub){return'<div class="sr"><div><span class="l">'+l+'</span>'+(sub?'<small>'+sub+'</small>':'')+'</div>'+right+'</div>'}
function sact(act,l,cls){return'<button class="sr act '+(cls||"")+'" data-act="'+act+'"><span class="l">'+l+'</span></button>'}
function sw(id,on){return'<label class="sw2"><input type="checkbox" id="'+id+'"'+(on?' checked':'')+'><span></span></label>'}
function sel(id,arr,cur,suf){return'<select id="'+id+'">'+arr.map(function(n){return'<option value="'+n+'"'+(cur===n?' selected':'')+'>'+n+(suf||"")+'</option>'}).join("")+'</select>'}
function renderSet(){
  var D=[[1,"Mon"],[2,"Tue"],[3,"Wed"],[4,"Thu"],[5,"Fri"],[6,"Sat"],[0,"Sun"]],on=g("wwm-notif")==="1",h="";
  h+=sec("Notifications",[
    sr("Reminders",sw("sRem",on),"Weekly alerts for your shop checklist"),
    sr("Permission",'<span><span class="v" id="ps">…</span> <button class="chip" id="allowb" data-act="allow" hidden>Allow</button></span>'),
    '<div class="sr col"><div><span class="l">Reminder days</span></div><div class="chips" style="margin-top:10px">'+D.map(function(d){return'<button class="chip'+(cfg.days.indexOf(d[0])>=0?' on':'')+'" data-day="'+d[0]+'">'+d[1]+'</button>'}).join("")+'</div></div>',
    sr("First reminder",'<input type="time" id="tm" value="'+cfg.time+'">'),
    sr("Repeats per day",sel("tn",[1,2,3],cfg.times),"Spaced 4 hours apart"),
    sr("Last-minute reminder",sw("lm",cfg.last),"A final alert before Monday’s reset"),
    cfg.last?sr("Alert before reset",sel("lh",[1,2,3,6,12],cfg.lastH," h")):"",
    sact("test","Send test notification")
  ].filter(Boolean));
  h+=sec("Appearance",[
    '<div class="sr col"><div><span class="l">Theme</span></div><div class="seg" style="margin-top:10px">'+["auto","light","dark"].map(function(t){return'<button class="chip'+(cfg.theme===t?' on':'')+'" data-th="'+t+'">'+t[0].toUpperCase()+t.slice(1)+'</button>'}).join("")+'</div></div>',
    '<div class="sr col"><div><span class="l">Accent color</span></div><div class="sws" style="margin-top:10px">'+SW.map(function(c){return'<button class="sw'+(cfg.accent===c?' on':'')+'" style="background:'+c+'" data-ac="'+c+'" aria-label="'+c+'"></button>'}).join("")+'<input type="color" id="acc" value="'+cfg.accent+'" aria-label="Custom color"></div></div>'
  ]);
  h+=sec("Lists and data",[
    sr("Manage lists",'<span class="v">On Home</span>',"Use ⋯ on a category, + to add, and the arrange button to reorder"),
    sact("rstp","Reset this week’s progress"),
    sact("rstl","Restore default shops and items","dng")
  ]);
  h+=sec("About",[
    '<div class="sr col" style="align-items:center;text-align:center;gap:6px"><img class="logo" src="'+LOGO+'" alt=""><b>Weekly Shops</b><span class="v">Version '+VERSION+'</span></div>',
    sr("Developer",'<span class="v">'+esc(DEV.name)+'</span>'),
    '<a class="sr act" href="'+esc(DEV.url)+'" target="_blank" rel="noopener"><span class="l">GitHub page</span><span class="v">Open</span></a>',
    sact("policy","Privacy policy"),sact("notes","Notes"),sact("patch","Patch notes")
  ],"Unofficial fan tool. Not affiliated with the game’s publisher.");
  $("setbody").innerHTML=h;showPerm()}
var sb=$("setbody");
sb.addEventListener("click",function(e){var t=e.target.closest("[data-day],[data-th],[data-ac],[data-act]");if(!t)return;
  if(t.dataset.day!==undefined){var d=+t.dataset.day,i=cfg.days.indexOf(d);if(i>=0)cfg.days.splice(i,1);else cfg.days.push(d);saveCfg();renderSet()}
  else if(t.dataset.th){cfg.theme=t.dataset.th;saveCfg();renderSet()}
  else if(t.dataset.ac){cfg.accent=t.dataset.ac;saveCfg();renderSet()}
  else{var a=t.dataset.act;
    if(a==="test")testNotif();
    else if(a==="allow")enable().then(renderSet);
    else if(a==="rstp")confirmS("Reset progress?","All items will be marked as not done for this week.","Reset",function(){st.done={};save();render();toast("Progress reset")});
    else if(a==="rstl")confirmS("Restore defaults?","This replaces all your shops, items, renames and custom categories with the original list.","Restore",function(){L=defaults();st.done={};mode="";save();saveL();toast("Defaults restored")});
    else if(a==="policy")docS("Privacy policy","<p>This app works fully offline. Your checklist, settings and lists are stored <b>only on this device</b>.</p><ul><li>No account, no ads, no analytics, no tracking.</li><li>Nothing is sent to any server.</li><li>Notifications are scheduled locally by your phone. The only permission requested is notifications.</li><li>Clearing the app’s data deletes everything.</li></ul>");
    else if(a==="notes")docS("Notes","<ul><li>Progress resets every Monday at 02:30, matching the game restock.</li><li>Reminders fire even when the app is closed, but some phones delay them. Set battery usage to Unrestricted for this app.</li><li>The last-minute reminder is fixed, so it still fires if you finished early.</li><li>Reminder notifications use their own high-importance channel so they can appear as banners.</li></ul>");
    else if(a==="patch")docS("Patch notes","<p><b>1.6</b></p><ul><li>New app logo</li><li>Developer info and GitHub link in About</li><li>Safer first-run loading of the default shops and items</li><li>On-screen error message instead of failing silently</li></ul><p><b>1.5</b></p><ul><li>Reminders use a high-importance channel for pop-up banners</li><li>Rename, edit, delete and drag to reorder shops and items</li><li>Per-category options menu</li><li>Redesigned, grouped settings</li><li>Smaller floating navigation</li></ul><p><b>1.4</b></p><ul><li>Floating bar that hides on scroll, fixed overlapping screens, custom categories</li></ul><p><b>1.3</b></p><ul><li>Bottom navigation, slide transitions, fixed Send test</li></ul><p><b>1.2</b></p><ul><li>Settings, custom tasks, accent color, themes, new icon</li></ul><p><b>1.1</b></p><ul><li>SVG icons, animations, Monday/Thursday/Saturday reminders</li></ul><p><b>1.0</b></p><ul><li>First release</li></ul>")}});
sb.addEventListener("change",function(e){var t=e.target;
  if(t.id==="sRem"){if(t.checked)enable().then(function(ok){if(!ok)t.checked=false});else{s("wwm-notif","0");sched();dueCheck();toast("Reminders off")}return}
  if(t.id==="tm"&&t.value)cfg.time=t.value;else if(t.id==="tn")cfg.times=+t.value;else if(t.id==="lm"){cfg.last=t.checked;saveCfg();renderSet();return}
  else if(t.id==="lh")cfg.lastH=+t.value;else if(t.id==="acc"){cfg.accent=t.value;saveCfg();renderSet();return}else return;
  saveCfg()});

/* ---------- navigation ---------- */
function show(v){var h=$("home"),p=$("settings");
  $("track").style.transform=v?"translateX(-50%)":"translateX(0)";document.querySelector(".nav").classList.remove("hide");
  h.setAttribute("aria-hidden",v);p.setAttribute("aria-hidden",!v);
  $("nh").classList.toggle("on",!v);$("ns").classList.toggle("on",v);$("pill").classList.toggle("s",v);if(v)renderSet()}
$("nh").onclick=function(){show(false)};
$("ns").onclick=function(){show(true)};
(function(){var nv=document.querySelector(".nav");[$("home"),$("settings")].forEach(function(p){var y=0;p.addEventListener("scroll",function(){var c=p.scrollTop;if(c>y+8&&c>60)nv.classList.add("hide");else if(c<y-8||c<20)nv.classList.remove("hide");y=c},{passive:true})})})();
look();render();dueCheck();firstRun();
</script>
