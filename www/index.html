<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121722">
<title>Weekly Shops</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#161c2a;--mut:#667089;--bd:#dde2ec;--no:#d6455d;--ac:#1fb58f;--ok:#1fb58f;--on:#06241a;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121722;--card:#1b2232;--tx:#e9edf6;--mut:#8f9ab4;--bd:#2a3349;--no:#ff6f86}}
:root[data-theme="dark"]{--bg:#121722;--card:#1b2232;--tx:#e9edf6;--mut:#8f9ab4;--bd:#2a3349;--no:#ff6f86}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.page{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 96px);transition:transform .38s cubic-bezier(.32,.72,0,1),opacity .3s}
.page>.in{max-width:560px;margin:0 auto}
.page.l{transform:translateX(-28%);opacity:0;pointer-events:none}
.page.r{transform:translateX(100%);opacity:0;pointer-events:none}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:8px 14px calc(env(safe-area-inset-bottom,0px) + 8px);background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--bd)}
.nav .in{max-width:560px;margin:0 auto;position:relative;display:grid;grid-template-columns:1fr 1fr}
.nav button{position:relative;z-index:1;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;font:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:color .25s}
.nav button.on{color:var(--ac)}
.nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.nav button.on svg{transform:translateY(-2px) scale(1.12)}
.pill{position:absolute;top:0;bottom:0;left:0;width:50%;border-radius:14px;background:color-mix(in srgb,var(--ac) 14%,transparent);transition:transform .38s cubic-bezier(.32,.72,0,1)}
.pill.s{transform:translateX(100%)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 88px);transform:translate(-50%,20px);opacity:0;background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;max-width:88%;text-align:center;z-index:9;pointer-events:none;transition:transform .3s,opacity .3s}
.toast.show{transform:translate(-50%,0);opacity:1}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ringp{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.ring.fin{animation:ringp .6s}
.btn,.chip{transition:transform .12s,background .2s}
.btn:active,.chip:active,.sw:active{transform:scale(.95)}
.chip.on,.sw.on{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
[hidden]{display:none!important}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:26px;margin:8px 0 2px;letter-spacing:-.02em}
h2{font-size:15px;margin:22px 0 8px}
.sub{color:var(--mut);font-size:14px;margin:0 0 16px}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer;flex:none}
.bi{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-right:6px}
.ib .bi{margin:0}
.hero{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center}
.ring{width:72px;height:72px;flex:none;position:relative}
.ring svg{width:72px;height:72px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px}
.hero p{margin:0;font-size:14px;color:var(--mut)}
.hero strong{display:block;font-size:19px;color:var(--tx)}
.acts{display:flex;gap:8px;margin:12px 0 10px}
.btn{flex:1;border:0;border-radius:14px;padding:13px;font-weight:600;font-size:15px;font-family:inherit;cursor:pointer;background:var(--ac);color:var(--on)}
.rst{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.bell{width:100%;margin:0 0 16px;display:block}
.bell small{display:block;font-weight:400;color:var(--mut);font-size:12px;margin-top:2px}
details{background:var(--card);border:1px solid var(--bd);border-radius:18px;margin-bottom:10px;overflow:hidden}
summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}
summary::-webkit-details-marker{display:none}
.ic{width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac);display:grid;place-items:center;flex:none}
.ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nm{flex:1;font-weight:600}
.ct{font-size:13px;color:var(--mut)}
.ct.full{color:var(--ok);font-weight:600}
.row{display:flex;width:100%;align-items:center;gap:12px;border:0;border-top:1px solid var(--bd);background:none;color:var(--tx);padding:13px 14px;font:inherit;text-align:left;cursor:pointer}
.row:active{background:color-mix(in srgb,var(--ac) 8%,transparent)}
.row.on{color:var(--mut)}
.row.on span:last-child{text-decoration:line-through}
.mk{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--no) 16%,transparent);color:var(--no);transition:background .25s,color .25s}
.mk svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.on .mk{background:var(--ok);color:var(--on)}
.mk.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.mk.pop svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .35s .12s ease-out forwards}
@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
#arc{transition:stroke-dashoffset .6s ease,stroke .3s}
.foot{color:var(--mut);font-size:13px;text-align:center;margin-top:18px}
.chips,.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:46px}
.chip.on{background:var(--ac);color:var(--on);border-color:transparent;font-weight:600}
.seg .chip{flex:1}
.fld{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.fld select,.fld input[type=time],.add input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
.fld input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac)}
.sws{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--tx)}
input[type=color]{width:40px;height:36px;border:0;background:none;padding:0}
.add{display:flex;gap:8px;margin-bottom:8px}
.add input{flex:1;min-width:0}
.add .btn{flex:none;padding:10px 16px}
.ctask{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:6px}
.ctask button{border:0;background:none;color:var(--no);cursor:pointer;padding:4px}
.doc{padding:0 14px 14px;color:var(--mut);font-size:14px}
.doc p,.doc li{margin:6px 0}
.doc ul{padding-left:18px;margin:6px 0}
.doc b{color:var(--tx)}
@media(prefers-reduced-motion:reduce){.mk.pop,.mk.pop svg path{animation:none;stroke-dashoffset:0}#arc{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="gem" viewBox="0 0 24 24"><path d="M6 4h12l4 6-10 11L2 10z M2 10h20"/></symbol>
<symbol id="chest" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="11" rx="2"/><path d="M3 12h18M12 12v3"/></symbol>
<symbol id="shirt" viewBox="0 0 24 24"><path d="M8 3L3 6l2 4 3-1v11h8V9l3 1 2-4-5-3a4 4 0 01-8 0z"/></symbol>
<symbol id="anvil" viewBox="0 0 24 24"><path d="M4 8h13a3 3 0 01-3 4H9l-1 3h8v3H6v-3l2-3M4 8v2"/></symbol>
<symbol id="bag" viewBox="0 0 24 24"><path d="M6 8h12l1 12H5zM9 8a3 3 0 016 0"/></symbol>
<symbol id="sword" viewBox="0 0 24 24"><path d="M20 4l-9 9M16 4h4v4M4 20l5-5M7 13l4 4"/></symbol>
<symbol id="pin" viewBox="0 0 24 24"><path d="M12 21s-7-6-7-11a7 7 0 0114 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
<symbol id="leaf" viewBox="0 0 24 24"><path d="M5 19C5 10 10 5 20 5c0 10-5 15-14 15M5 19l8-8"/></symbol>
<symbol id="star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
<symbol id="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
<symbol id="cross" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 21h4"/></symbol>
<symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></symbol>
<symbol id="home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4zM10 20v-6h4v6"/></symbol>
<symbol id="back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
</svg>

<div class="page" id="home"><div class="in">
<header class="hd"><div><h1>Weekly shops</h1><p class="sub">Resets every Monday at 02:30</p></div></header>
<section class="hero">
  <div class="ring"><svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="30" fill="none" stroke="var(--bd)" stroke-width="8"/><circle id="arc" cx="36" cy="36" r="30" fill="none" stroke="var(--ok)" stroke-width="8" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5"/></svg><b id="pct">0%</b></div>
  <p><strong id="cnt">0 of 0 done</strong><span id="msg">Tap an item to mark it done.</span></p>
</section>
<div class="acts">
  <button class="btn" id="all"><svg class="bi"><use href="#tick"/></svg>Mark all complete</button>
  <button class="btn rst" id="rst"><svg class="bi"><use href="#cross"/></svg>Reset</button>
</div>
<button class="btn rst bell" id="bell"></button>
<div id="list"></div>
<p class="foot">Progress is saved on this device.</p>
</div></div>

<div class="page r" id="settings" aria-hidden="true"><div class="in">
<header class="hd"><div><h1>Settings</h1><p class="sub">Changes save automatically</p></div></header>
<div id="setbody"></div>
</div></div>

<nav class="nav"><div class="in"><span class="pill" id="pill"></span>
<button id="nh" class="on"><svg><use href="#home"/></svg>Home</button>
<button id="ns"><svg><use href="#gear"/></svg>Settings</button></div></nav>
<div class="toast" id="toast" role="status"></div>

<script>
var SHOPS=[
["Featured","gem",["Bag of Coins","Lingering Melody"]],
["Legacy Exchange","chest",["Re-attunement Stone: Dustless","Inner Way Note: Chest","Mystic Skill Breakthrough chests","Retuning Stone"]],
["Red Gold Boutique","shirt",["Resonating Melody"]],
["Sect Shop","anvil",["Lodestone","Peridot","Small Ratchet"]],
["Social Shop","bag",["Arena Attunement Stone","Transdust: Lingering Melody","Transdust: Random Collectible box"]],
["Appearance Exchange","shirt",["Lingering Melody"]],
["Combat Development","sword",["Golden Silk Coin Bag","Howling Ore","Inner Way Note: Chest","Mystic Skill Breakthrough chests","Life Supplies Support Box","Martial Arts breakthrough chests"]],
["Gear Chest","chest",["Gear Chest"]],
["Season Catch-up","leaf",["Martial Arts breakthrough chests"]],
["Legendary Gear Exchange","sword",["Re-attunement Stone","Retuning Stones","Legendary chests"]],
["Profession Development","anvil",["Career Notebook","Scholar Giftbox","Healer Giftbox","Custom Career Giftbox"]],
["Hu Niu’er’s General Goods","pin",["Raw Ore","Chloride Schist","Cold Iron","Dushan Jade","Dushan Blue Jade"]],
["Kaifeng General Goods","pin",["Raw Ore"]],
["Harvestfall Village Vendor","pin",["Wine Scented Jade","Raw Ore"]],
["Heaven’s Pier Merchant","pin",["Wine Scented Jade"]]
];
function g(k){try{return localStorage.getItem(k)}catch(e){return null}}
function s(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var DEF={days:[1,4,6],time:"09:00",times:1,last:true,lastH:3,accent:"#1fb58f",theme:"auto",custom:[]};
var cfg=DEF;try{cfg=Object.assign({},DEF,JSON.parse(g("wwm-cfg")||"{}"))}catch(e){}
var KEY="wwm-weekly-v1",open={},lastKey="",allPop=false,timers=[],intro=true,wasFin=false;
var tt;function toast(m){var e=document.getElementById("toast");e.textContent=m;e.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){e.classList.remove("show")},3600)}
function weekId(){var d=new Date(Date.now()-9000000);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toDateString()}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY));if(x&&x.week===weekId())return x}catch(e){}return{week:weekId(),done:{}}}
function save(){s(KEY,JSON.stringify(st))}
var st=load();
function groups(){var a=SHOPS.map(function(x,i){return{n:x[0],ic:x[1],items:x[2].map(function(t,j){return{t:t,k:i+"-"+j}})}});
  if(cfg.custom.length)a.push({n:"My tasks",ic:"star",items:cfg.custom.map(function(c){return{t:c.t,k:"c"+c.id}})});return a}
function counts(){var t=0,d=0;groups().forEach(function(x){x.items.forEach(function(i){t++;if(st.done[i.k])d++})});return{t:t,d:d}}
function left(){var c=counts();return c.t-c.d}
function lum(h){var n=parseInt(h.slice(1),16),r=n>>16&255,gg=n>>8&255,b=n&255;return(.299*r+.587*gg+.114*b)/255}
function look(){var r=document.documentElement;
  if(cfg.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",cfg.theme);
  r.style.setProperty("--ac",cfg.accent);r.style.setProperty("--ok",cfg.accent);r.style.setProperty("--on",lum(cfg.accent)>.6?"#10151f":"#fff")}
function render(){
  var c=counts(),h="";
  groups().forEach(function(x,i){var n=0;x.items.forEach(function(it){if(st.done[it.k])n++});
    h+='<details data-i="'+i+'"'+(open[i]===false?'':' open')+(intro?' style="animation:up .45s '+(i*45)+'ms both"':'')+'><summary><span class="ic"><svg><use href="#'+x.ic+'"/></svg></span><span class="nm">'+esc(x.n)+'</span><span class="ct'+(n===x.items.length?' full':'')+'">'+n+'/'+x.items.length+'</span></summary>';
    x.items.forEach(function(it){var on=st.done[it.k];
      h+='<button class="row'+(on?' on':'')+'" data-k="'+it.k+'"><span class="mk'+((on&&(allPop||it.k===lastKey))?' pop':'')+'"><svg><use href="#'+(on?'tick':'cross')+'"/></svg></span><span>'+esc(it.t)+'</span></button>'});
    h+='</details>'});
  document.getElementById("list").innerHTML=h;
  document.getElementById("arc").style.strokeDashoffset=188.5*(1-(c.t?c.d/c.t:0));
  document.getElementById("pct").textContent=(c.t?Math.round(c.d/c.t*100):0)+"%";
  document.getElementById("cnt").textContent=c.d+" of "+c.t+" done";
  document.getElementById("msg").textContent=c.d===c.t?"All done for this week.":"Tap an item to mark it done.";
  lastKey="";intro=false;
  var fin=c.t>0&&c.d===c.t;if(fin&&!wasFin){var rg=document.querySelector(".ring");rg.classList.remove("fin");void rg.offsetWidth;rg.classList.add("fin")}wasFin=fin;
}
document.getElementById("list").addEventListener("click",function(e){var r=e.target.closest(".row");
  if(r){var k=r.dataset.k;if(st.done[k])delete st.done[k];else{st.done[k]=1;lastKey=k}save();render()}});
document.getElementById("list").addEventListener("toggle",function(e){open[e.target.dataset.i]=e.target.open},true);
document.getElementById("all").onclick=function(){groups().forEach(function(x){x.items.forEach(function(i){st.done[i.k]=1})});allPop=true;save();render();allPop=false};
document.getElementById("rst").onclick=function(){st.done={};save();render()};

/* ---------- notifications ---------- */
var ORDER=[1,2,3,4,5,6,0],bell=document.getElementById("bell");
function native(){return window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications}
function hm(){var p=cfg.time.split(":");return(+p[0])*60+(+p[1])}
function lastDay(){return ORDER.filter(function(d){return cfg.days.indexOf(d)>=0}).pop()}
function msg(d){return d===lastDay()?["Last day this week","Final chance to finish your checklist before Monday’s reset."]:["Weekly shops","Time to check your weekly shop checklist."]}
function bellUI(note){var on=g("wwm-notif")==="1";
  bell.innerHTML='<svg class="bi"><use href="#bell"/></svg>'+(on?'Reminders on':'Turn on reminders')+'<small>'+(note||(on?'Using your settings':'Allow notifications to get reminders'))+'</small>'}
async function sched(){
  if(!native())return;var LN=Capacitor.Plugins.LocalNotifications;
  try{var p=await LN.getPending();if(p.notifications.length)await LN.cancel({notifications:p.notifications})}catch(e){}
  if(g("wwm-notif")!=="1")return;
  var list=[],base=hm();
  cfg.days.forEach(function(d){for(var n=0;n<cfg.times;n++){var m=base+n*240;if(m>=1440)break;var t=msg(d);
    list.push({id:100+d*10+n,title:t[0],body:t[1],schedule:{on:{weekday:d+1,hour:Math.floor(m/60),minute:m%60},allowWhileIdle:true}})}});
  if(cfg.last){var m=150-cfg.lastH*60,wd=2;if(m<0){m+=1440;wd=1}
    list.push({id:900,title:"Shops reset soon",body:"Reset in "+cfg.lastH+"h. Finish what’s left.",schedule:{on:{weekday:wd,hour:Math.floor(m/60),minute:m%60},allowWhileIdle:true}})}
  if(list.length)try{await LN.schedule({notifications:list})}catch(e){}
}
async function enable(){var ok=false;
  try{if(native()){var p=await Capacitor.Plugins.LocalNotifications.requestPermissions();ok=p.display==="granted"}
  else if("Notification" in window){ok=(await Notification.requestPermission())==="granted"}}catch(e){}
  if(ok){s("wwm-notif","1");await sched();dueCheck();bellUI();toast("Reminders on")}else{s("wwm-notif","0");var m=native()?"Blocked. Allow in Android Settings > Apps > Weekly Shops > Notifications.":"Not available in this browser. Use the APK for reminders.";bellUI(m);toast(m)}
  return ok}
function dueCheck(){timers.forEach(clearTimeout);timers=[];
  if(native()||!("Notification" in window)||Notification.permission!=="granted"||g("wwm-notif")!=="1")return;
  var d=new Date();if(cfg.days.indexOf(d.getDay())<0)return;
  for(var n=0;n<cfg.times;n++){var m=hm()+n*240;if(m>=1440)break;var t=new Date();t.setHours(0,m,0,0);
    if(t>d)timers.push(setTimeout(function(){if(left()>0){var x=msg(new Date().getDay());try{new Notification(x[0],{body:left()+" items left. "+x[1]})}catch(e){}}},t-d))}}
bell.onclick=enable;
async function permState(){try{if(native()){var p=await Capacitor.Plugins.LocalNotifications.checkPermissions();return p.display==="granted"?"Allowed":p.display==="denied"?"Blocked":"Not asked yet"}if("Notification" in window)return Notification.permission==="granted"?"Allowed":Notification.permission==="denied"?"Blocked":"Not asked yet"}catch(e){}return"Unavailable here"}
function showPerm(){permState().then(function(t){var e=document.getElementById("ps");if(e)e.textContent=t})}
async function testNotif(){
  try{
    if(native()){var LN=Capacitor.Plugins.LocalNotifications,p=await LN.checkPermissions();
      if(p.display!=="granted")p=await LN.requestPermissions();
      if(p.display!=="granted"){toast("Blocked. Allow in Android Settings > Apps > Weekly Shops > Notifications.");showPerm();return}
      await LN.schedule({notifications:[{id:999,title:"Test reminder",body:"Reminders are working.",schedule:{at:new Date(Date.now()+1500),allowWhileIdle:true}}]});toast("Test sent. Check your notifications.")}
    else if("Notification" in window){var r=Notification.permission==="granted"?"granted":await Notification.requestPermission();
      if(r!=="granted"){toast("Notifications are blocked in this browser.");return}new Notification("Test reminder",{body:"Reminders are working."});toast("Test sent")}
    else toast("Not available in this browser. Use the APK.")
  }catch(e){toast("Could not send: "+(e&&e.message?e.message:"unknown error"))}
  showPerm()}
async function firstRun(){if(!native())return;var LN=Capacitor.Plugins.LocalNotifications;
  try{var p=await LN.checkPermissions();
    if(p.display==="prompt"||p.display==="prompt-with-rationale")p=await LN.requestPermissions();
    if(p.display==="granted"){if(g("wwm-notif")===null)s("wwm-notif","1");await sched()}else s("wwm-notif","0");
    bellUI()}catch(e){toast("Notification setup failed: "+(e&&e.message?e.message:"unknown error"))}}

/* ---------- settings ---------- */
var SW=["#1fb58f","#4b5fd6","#e0577a","#e8933a","#9a5bd6","#2b9be0"];
function persist(){s("wwm-cfg",JSON.stringify(cfg));look();sched();dueCheck();render()}
function renderSet(){
  var D=[[1,"Mon"],[2,"Tue"],[3,"Wed"],[4,"Thu"],[5,"Fri"],[6,"Sat"],[0,"Sun"]],h="";
  h+='<h2>Reminder days</h2><div class="chips">'+D.map(function(d){return'<button class="chip'+(cfg.days.indexOf(d[0])>=0?' on':'')+'" data-day="'+d[0]+'">'+d[1]+'</button>'}).join("")+'</div>';
  h+='<h2>Timing</h2><div class="fld"><span>First reminder at</span><input type="time" id="tm" value="'+cfg.time+'"></div>';
  h+='<div class="fld"><span>Times per day (4h apart)</span><select id="tn">'+[1,2,3].map(function(n){return'<option'+(cfg.times===n?' selected':'')+'>'+n+'</option>'}).join("")+'</select></div>';
  h+='<div class="fld"><span>Last-minute reminder</span><input type="checkbox" id="lm"'+(cfg.last?' checked':'')+'></div>';
  h+='<div class="fld"><span>Hours before Monday reset</span><select id="lh">'+[1,2,3,6,12].map(function(n){return'<option'+(cfg.lastH===n?' selected':'')+'>'+n+'</option>'}).join("")+'</select></div>';
  h+='<div class="fld"><span>Notification permission</span><span><b id="ps">…</b> <button class="chip" id="allow">Allow</button></span></div>';
  h+='<div class="acts"><button class="btn rst" id="test"><svg class="bi"><use href="#bell"/></svg>Send test</button></div>';
  h+='<h2>Appearance</h2><div class="seg">'+["auto","light","dark"].map(function(t){return'<button class="chip'+(cfg.theme===t?' on':'')+'" data-th="'+t+'">'+t[0].toUpperCase()+t.slice(1)+'</button>'}).join("")+'</div>';
  h+='<h2>Accent color</h2><div class="sws">'+SW.map(function(c){return'<button class="sw'+(cfg.accent===c?' on':'')+'" style="background:'+c+'" data-ac="'+c+'" aria-label="'+c+'"></button>'}).join("")+'<input type="color" id="acc" value="'+cfg.accent+'"></div>';
  h+='<h2>My tasks</h2><div class="add"><input id="ct" placeholder="Add a task, e.g. Daily quests" maxlength="60"><button class="btn" id="ca">Add</button></div>';
  h+=cfg.custom.map(function(c){return'<div class="ctask"><span>'+esc(c.t)+'</span><button data-rm="'+c.id+'" aria-label="Remove"><svg class="bi"><use href="#trash"/></svg></button></div>'}).join("");
  h+='<h2>About</h2>'+
  '<details><summary><span class="nm">Privacy policy</span></summary><div class="doc"><p>This app works fully offline. Your checklist, settings and custom tasks are stored <b>only on this device</b>.</p><ul><li>No account, no ads, no analytics, no tracking.</li><li>Nothing is sent to any server.</li><li>Notifications are scheduled locally by your phone. The only permission requested is notifications.</li><li>Clearing the app’s data deletes everything.</li></ul></div></details>'+
  '<details><summary><span class="nm">Notes</span></summary><div class="doc"><ul><li>Progress resets every Monday at 02:30, matching the game restock.</li><li>Reminders fire even when the app is closed, but some phones delay them. Set battery usage to Unrestricted for this app.</li><li>The last-minute reminder is fixed, so it still fires if you finished early.</li><li>This is an unofficial fan tool and is not affiliated with the game’s publisher.</li></ul></div></details>'+
  '<details><summary><span class="nm">Patch notes</span></summary><div class="doc"><p><b>1.3</b></p><ul><li>Bottom navigation with slide transitions</li><li>Send test fixed and shows a clear result message</li><li>Permission is requested at launch and its status is shown in Settings</li><li>More animations</li></ul><p><b>1.2</b></p><ul><li>Settings: reminder days, time, times per day, last-minute reminder</li><li>Custom tasks, accent color, light and dark mode</li><li>New app icon</li><li>Asks for notification permission on first launch</li><li>Privacy policy, notes and patch notes</li></ul><p><b>1.1</b></p><ul><li>SVG tick and cross icons with animation</li><li>Monday, Thursday and Saturday reminders</li></ul><p><b>1.0</b></p><ul><li>Weekly shop checklist, progress ring, weekly reset</li></ul></div></details>';
  document.getElementById("setbody").innerHTML=h;showPerm()}
var sb=document.getElementById("setbody");
sb.addEventListener("click",function(e){var t=e.target.closest("button");if(!t)return;
  if(t.dataset.day!==undefined){var d=+t.dataset.day,i=cfg.days.indexOf(d);if(i>=0)cfg.days.splice(i,1);else cfg.days.push(d)}
  else if(t.dataset.th){cfg.theme=t.dataset.th}
  else if(t.dataset.ac){cfg.accent=t.dataset.ac}
  else if(t.dataset.rm){cfg.custom=cfg.custom.filter(function(c){return String(c.id)!==t.dataset.rm});delete st.done["c"+t.dataset.rm];save()}
  else if(t.id==="ca"){var v=document.getElementById("ct").value.trim();if(!v)return;cfg.custom.push({id:Date.now(),t:v})}
  else if(t.id==="test"){testNotif();return}
  else if(t.id==="allow"){enable().then(renderSet);return}
  else return;
  persist();renderSet()});
sb.addEventListener("change",function(e){var t=e.target;
  if(t.id==="tm"&&t.value)cfg.time=t.value;else if(t.id==="tn")cfg.times=+t.value;else if(t.id==="lm")cfg.last=t.checked;else if(t.id==="lh")cfg.lastH=+t.value;else if(t.id==="acc")cfg.accent=t.value;else return;
  persist();if(t.id==="acc")renderSet()});
function show(v){var h=document.getElementById("home"),p=document.getElementById("settings");
  h.classList.toggle("l",v);p.classList.toggle("r",!v);h.setAttribute("aria-hidden",v);p.setAttribute("aria-hidden",!v);
  document.getElementById("nh").classList.toggle("on",!v);document.getElementById("ns").classList.toggle("on",v);
  document.getElementById("pill").classList.toggle("s",v);if(v)renderSet()}
document.getElementById("nh").onclick=function(){show(false)};
document.getElementById("ns").onclick=function(){show(true)};
look();render();bellUI();dueCheck();firstRun();
</script>
</body>
</html>
