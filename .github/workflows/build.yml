name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Add notification permissions
        run: |
          f=android/app/src/main/AndroidManifest.xml
          for perm in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM; do
            grep -q "android.permission.$perm" $f || sed -i "s#<application#<uses-permission android:name=\"android.permission.$perm\" />\n    <application#" $f
          done
          grep permission $f
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-shops-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
